<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pikd</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: linear-gradient(180deg, #2A6FFF 0%, #1B4FCC 100%);
      color: #FFFBF2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 27px;
      margin: 0 auto 28px;
      display: block;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    .tagline {
      color: #D8E4FF;
      font-size: 16px;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }
    a {
      display: block;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 12px;
      color: #FFFBF2;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    a:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: #FFE14D;
      color: #FFE14D;
    }
    .footer {
      margin-top: 40px;
      color: #B7C7E8;
      font-size: 12px;
    }
    .footer a {
      display: inline;
      padding: 0;
      background: none;
      border: none;
      color: #B7C7E8;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="icon.png" alt="Pikd icon">
    <h1>Pikd</h1>
    <p class="tagline">The tier list maker, built for arguments.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="support.html">Support</a>
    </div>
    <p class="footer">
      <a href="https://apps.apple.com/app/id6760365857">Download on the App Store</a><br>
      Cloud Motion Lab &middot; <a href="mailto:dev@slyapp.co">dev@slyapp.co</a>
    </p>
  </div>
</body>
</html>
